<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ride Routes</title>
  <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    #info { position: absolute; top: 10px; left: 10px; background: white; 
            padding: 10px; border-radius: 4px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="info">Year: <span id="year"></span></div>

  <script>
    const { DeckGL, MVTLayer, TileLayer, BitmapLayer } = deck;

    // Get year from URL parameter, default to 2024
    const urlParams = new URLSearchParams(window.location.search);
    const year = urlParams.get('year') || '9999';
    document.getElementById('year').textContent = year;

    // Initialize deck.gl
    new DeckGL({
      container: 'map',
      initialViewState: {
        latitude: 39.8283,
        longitude: -98.5795,
        zoom: 4,
        pitch: 0,
        bearing: 0
      },
      controller: true,
      layers: [
        new TileLayer({
          id: 'osm-basemap',
          data: 'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
          minZoom: 0,
          maxZoom: 19,
          tileSize: 256,
          maxRequests: 10,
          renderSubLayers: props => {
                  const {
                    bbox: {west, south, east, north}
                  } = props.tile;
    
                  return new BitmapLayer({
                    id: `${props.id}-bitmap`,
                    image: props.data,
                    bounds: [west, south, east, north]
                  });
                }
        }),

        new MVTLayer({
          id: 'routes',
          data: `http://localhost:7800/public.ride_routes/{z}/{x}/{y}.pbf?year=${year}`,
          minZoom: 0,
          maxZoom: 14,
          getLineColor: d => {
            const count = d.properties.ride_count || 1;
            const intensity = Math.min(count / 100 * 255, 255);
            return [intensity, 0, 255 - intensity];
          },
          getLineWidth: d => {
            const count = d.properties.ride_count || 1;
            return Math.log(count + 1) * 2;
          },
          lineWidthMinPixels: 1
        })
      ]
    });
  </script>
</body>
</html>
