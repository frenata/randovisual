<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RandoVisual</title>
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/@loaders.gl/mvt@latest/dist/dist.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/mvp.css"> 
    <link rel="stylesheet" href="main.css"> 
    <script src="main.js" type="module"></script>
  </head>
  <body>
    <div id="map"></div>
    <div id="filter">
      <form id="filters">
          <input name="year" placeholder="all years"/>
          <label for="year">Year</label>
          <div class="spacer"></div>
          <input name="distance" placeholder="none"/>
          <label for="distance">Minimum Distance</label>
          <input type="submit" hidden="true"/>
      </form>
    </div>
    <div id="info" style="display: none;">
      <div id="selected" style="display: none;">
        <h3 id="routeName"></h3>
        <div id="properties"></div>
      </div>
    </div>
  </body>
</html>
