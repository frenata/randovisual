[project]
name = "randovisual"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "fastapi[standard]>=0.121.3",
    "geoalchemy2>=0.18.1",
    "psycopg[binary]>=3.2.13",
    "pydantic>=2.12.4",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.44",
]

[dependency-groups]
dev = [
    "alembic>=1.17.2",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-vcr>=1.0.2",
    "ruff>=0.14.6",
    "testcontainers[postgres]>=4.13.3",
    "ty>=0.0.1a34",
]

[tool.ruff]
exclude = ["utils"]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "PLR0402", "FIX002", "TD003", "TD002", "C400",
    "D", "BLE001", "S113", "G004", "EM102", "TRY003", "TRY301", "FAST002"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests}/*" = ["S101", "ANN", "D", "ARG", "T", "PT", "PTH"]
"randovisual/api/*" = ["B008", "ANN201", "FBT001", "FBT002"]
