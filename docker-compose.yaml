services:
  db:
    image: postgis/postgis:18-3.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: rusa
      POSTGRES_USER: rusa
    volumes:
      - ./data/postgres:/var/lib/postgresql
  tiler:
    build:
      context: tiler
    ports:
      - "7800:7800"
      - "8080:8080"
    env_file:
      - .env.local
    depends_on:
      - db
  api:
    build:
      context: .
      dockerfile: randovisual/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.local
      - .env
    depends_on:
      - db
  fe:
    build:
      context: fe
    ports:
      - "8181:80"
    environment:
      TILER_URL: http://localhost:7800
    depends_on:
      - tiler
