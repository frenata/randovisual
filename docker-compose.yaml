services:
  db:
    image: postgis/postgis:18-3.6
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: rusa
      POSTGRES_USER: rusa
    volumes:
      - ./data/postgres:/var/lib/postgresql
  tiler:
    build:
      context: tiler
    ports:
      - "7800:7800"
    env_file:
      - .env.local
    depends_on:
      - db
  api:
    build:
      context: be
      dockerfile: Dockerfile
    volumes:
      - ./be:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.local
      - .env
    depends_on:
      - db
  fe:
    build:
      context: fe
    ports:
      - "8181:80"
    volumes:
      - ./fe:/usr/share/nginx/html
    environment:
      TILER_URL: http://localhost:7800
    depends_on:
      - tiler
